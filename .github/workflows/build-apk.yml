name: Build Debug APK

# 触发条件：推送到 main 分支时自动编译；也可在 Actions 页面手动触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 装 JDK 17（安卓 Gradle 构建需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) 缓存 Gradle，加快后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4) 给 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5) 跑单元测试；输出同时写入 build-output.log（pipefail 保证 gradle 失败即中断、不出包）
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build-output.log

      # 5.1) 失败时上传完整构建日志与测试报告，便于诊断编译/测试失败
      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 6) 编译 debug APK（个人自用，debug 签名即可安装）
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7) 把 APK 作为 artifact 上传，可在本次运行页面下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

# 下载方式：仓库页面 → Actions → 点开本次运行 → 页面底部 Artifacts → 下载 app-debug-apk.zip → 解压得到 .apk
# 注意：Android SDK 已包含在 GitHub 的 ubuntu-latest 运行环境中，无需在 workflow 里单独安装；
#       如遇 SDK / build-tools 版本问题，让 Claude Code 在此步骤前加 android-actions/setup-android@v3。
